name: 每日论文抓取

on:
  schedule:
    # UTC 时间 2:00 运行 = 北京时间 10:00（GitHub Actions 定时任务可能有几分钟到几十分钟延迟）
    - cron: "0 2 * * *"
  workflow_dispatch: {}  # 允许在 GitHub 页面手动触发
  push:
    branches: [main]     # 首次推送时自动跑一次，立即生成页面

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取论文
        run: python scripts/fetch_arxiv.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "没有新论文，跳过提交"
          else
            git commit -m "更新论文 $(date -u +'%Y-%m-%d')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
